<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gap Analysis</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components/card.css">
    <link rel="stylesheet" href="../../css/components/badge.css">
    <link rel="stylesheet" href="../../css/components/table.css">
    <link rel="stylesheet" href="../../css/components/stats.css">
    <link rel="stylesheet" href="../../css/components/button.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>
<body>

    <div class="dashboard-layout">
        <main class="dashboard-content" style="max-width: 1000px; margin: 0 auto; padding-top: 40px;">
            
            <div class="form-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Gap Analysis</h2>
                <button class="btn-outline" onclick="window.goBack()">Return Back</button>
            </div>

            <h1 id="courseTitle">Course Gap Analysis</h1>
            <p class="subtitle" style="margin-bottom: 30px;">Faculty Self-Reflection vs Student Feedback</p>

            <!-- summary cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <p>Avg Self Reflection</p>
                    <h2 id="selfScore">0%</h2>
                </div>
                <div class="stat-card">
                    <p>Avg Student Score</p>
                    <h2 id="studentScore">0%</h2>
                </div>
                <div class="stat-card">
                    <p>Overall Gap</p>
                    <h2 id="gapScore">0%</h2>
                </div>
            </div>

            <!-- comparison table -->
            <div class="card" style="padding: 0; margin-bottom: 24px;">
                <div style="padding: 20px; border-bottom: 1px solid #e2e8f0;">
                    <h3 style="margin: 0;">Module Performance Comparison</h3>
                </div>
                <table class="data-table" style="margin: 0; width: 100%;">
                    <thead>
                        <tr>
                            <th style="padding-left: 20px;">Category</th>
                            <th>Self Score</th>
                            <th>Student Score</th>
                            <th>Gap (Self vs Student)</th>
                        </tr>
                    </thead>
                    <tbody id="gapTable">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>

            <!-- comments -->
            <div class="card" style="margin-bottom: 24px;">
                <h3 style="margin-bottom: 16px;">Anonymous Student Comments</h3>
                <div id="commentList" style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- proceed to action -->
            <div id="actionContainer" style="text-align: center; margin-bottom: 40px; display: none;">
                <button id="btnAction" class="btn-primary" style="padding: 14px 40px; font-size: 16px; border-radius: 12px; background: #1e3a8a; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">Proceed to Action Report →</button>
            </div>

        </main>
    </div>

    <script type="module">
        import { requireAuth } from "../../js/core/session.js";
        import { renderGapAnalysis } from "../../js/features/gap-analysis.js";

        document.addEventListener("DOMContentLoaded", () => {
            requireAuth();
            renderGapAnalysis();
            
            window.goBack = function () {
                window.location.href = "reports.html";
            };
        });
    </script>

</body>
</html>
