<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Faculty Dashboard</title>

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/utilities.css">

    <link rel="stylesheet" href="../../css/components/button.css">
    <link rel="stylesheet" href="../../css/components/card.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/table.css">
    <link rel="stylesheet" href="../../css/components/badge.css">
    <link rel="stylesheet" href="../../css/components/stats.css">

    <link rel="stylesheet" href="../../css/pages/dashboard.css">

</head>


<body>


    <div class="dashboard-layout">


        <!-- SIDEBAR -->

        <aside class="sidebar">


            <div class="sidebar-logo">

                <img src="../../assets/logos/endur-logo.svg">

                <div>

                    <strong>Endur</strong>

                    <p>Faculty Portal</p>

                </div>

            </div>



            <nav class="sidebar-menu">

                <a class="active">
                    Dashboard
                </a>

                <a href="reports.html">
                    Feedback Reports
                </a>

            </nav>



            <a href="profile.html" class="sidebar-user">

                <div id="avatar" class="avatar"></div>

                <div>

                    <strong id="userName"></strong>

                    <p id="userDept"></p>

                </div>

            </a>


        </aside>




        <!-- MAIN -->

        <main class="dashboard-content">


            <h1>

                Faculty Dashboard

                <span class="badge neutral">

                    SPRING SEMESTER 2026

                </span>

            </h1>



            <!-- STATS -->

            <div class="stats-grid">


                <div class="stat-card">

                    <p>Student Satisfaction</p>

                    <h2 id="avgScore">

                        0

                    </h2>

                </div>



                <div class="stat-card">

                    <p>Response Rate</p>

                    <h2 id="responseRate">

                        0%

                    </h2>

                </div>



                <div class="stat-card">

                    <p>Pending Reflection</p>

                    <h2 id="pendingReflection">

                        0

                    </h2>

                </div>



                <div class="stat-card">

                    <p>Performance Gap</p>

                    <h2 id="gapScore">

                        0

                    </h2>

                </div>


            </div>



            <h2 class="section-title">

                Current Courses

            </h2>



            <table class="data-table">


                <thead>

                    <tr>

                        <th>Course Code</th>

                        <th>Course Name</th>

                        <th>Enrolled</th>

                        <th>Status</th>

                        <th>Avg Rating</th>

                    </tr>

                </thead>



                <tbody id="courseTable">

                </tbody>


            </table>



            <div id="emptyState" class="empty-state" style="display:none">

                <p>

                    No courses assigned yet.

                </p>

            </div>


        </main>


    </div>



    <script type="module">

        import { requireAuth } from "../../js/core/session.js";

        import {
            renderFacultyDashboard
        } from "../../js/features/faculty-dashboard.js";


        document.addEventListener("DOMContentLoaded", () => {

            const user = requireAuth();


            /* sidebar name */

            const nameEl =
                document.getElementById("userName");

            const deptEl =
                document.getElementById("userDept");

            const avatarEl =
                document.getElementById("avatar");


            if (nameEl) {

                nameEl.innerText = user.name;

            }


            if (deptEl) {

                deptEl.innerText = user.department;

            }


            /* avatar initials */

            if (avatarEl) {

                avatarEl.innerText =
                    user.name
                        .split(" ")
                        .map(n => n[0])
                        .join("");

            }


            /* render dashboard data */

            renderFacultyDashboard();

        });

    </script>


</body>

</html>
