<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Self Reflection</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/components/button.css">
    <link rel="stylesheet" href="../../css/components/card.css">
    <link rel="stylesheet" href="../../css/components/rating.css">
    <link rel="stylesheet" href="../../css/pages/feedback.css">
</head>
<body>

<div class="form-layout">
    <div class="form-header">
        <h2>Faculty Self-Reflection</h2>
        <button class="close-btn" onclick="goBack()">✕</button>
    </div>

    <h1>End-of-Term Self-Reflection</h1>
    <p class="subtitle">Evaluate your teaching effectiveness based on the cycle's parameters.</p>

    <div class="profile-card">
        <h3>Quantitative Assessment</h3>
        
        <div class="feedback-grid" id="dynamicQuestionsContainer">
            <p style="color: #64748b; font-style: italic; padding: 20px;">Loading evaluation parameters...</p>
        </div>
    </div>

    <div class="profile-card">
        <h3>Qualitative Assessment</h3>
        <label>Key achievements & areas for improvement</label>
        <textarea id="reflectionText" placeholder="Reflect on teaching approach, improvements, and challenges..."></textarea>
        <p class="sub-text">Visible only to academic leadership.</p>
    </div>

    <div class="form-actions">
        <button class="btn-outline" onclick="goBack()">Go Back</button>
        <button class="btn-primary" onclick="submitSelfReflection()">Submit Reflection →</button>
    </div>
</div>

<script type="module">
    import { requireAuth } from "../../js/core/session.js";
    import { initSelfReflection, submitSelfReflection } from "../../js/features/self-reflection.js";

    const user = requireAuth();
    if(user) {
        initSelfReflection();
    }

    window.submitSelfReflection = submitSelfReflection;
    window.goBack = () => window.location.href = "reports.html";
</script>

</body>
</html>
