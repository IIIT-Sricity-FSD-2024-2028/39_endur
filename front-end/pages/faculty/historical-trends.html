<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Historical Performance Trends</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components/card.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/button.css">
    <link rel="stylesheet" href="../../css/components/stats.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>
<body>

<div class="dashboard-layout">

    <!-- sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../assets/logos/endur-logo.svg">
            <div>
                <strong>Endur</strong>
                <p>Faculty Portal</p>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a class="active">Feedback Reports</a>
        </nav>

        <a href="profile.html" class="sidebar-user">
            <div class="avatar"></div>
            <div>
                <strong id="userName"></strong>
                <p id="userDept"></p>
            </div>
        </a>
    </aside>

    <!-- main -->
    <main class="dashboard-content">

        <div class="form-header">
            <h2>Historical Performance Trends <span id="trendCourseLabel" style="font-size: 0.6em; color: var(--primary); margin-left: 10px;"></span></h2>
            <button class="btn-primary" onclick="window.goBack()">
                Back To Reports
            </button>
        </div>

        <!-- overall chart -->
        <div class="card">
            <p>Overall Performance Score (Current)</p>
            <h1 id="overallScore">0%</h1>
            <div id="trendLine" class="trend-line" style="display: flex; align-items: flex-end; justify-content: space-between; height: 100px; padding-top: 20px; border-bottom: 2px solid #eee;">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.8em; color: #666;">
                <span>Fall '24</span>
                <span>Spring '25</span>
                <span>Fall '25</span>
                <span style="color: var(--primary); font-weight: bold;">Spring '26 (Current)</span>
            </div>
        </div>

        <!-- module trends -->
        <div class="stats-grid">
            <div class="card mini-chart">
                <h3>Clarity</h3>
                <div class="bar-group" id="clarityBars" style="display: flex; align-items: flex-end; gap: 5px; height: 80px; margin-top: 15px;"></div>
            </div>

            <div class="card mini-chart">
                <h3>Structure</h3>
                <div class="bar-group" id="structureBars" style="display: flex; align-items: flex-end; gap: 5px; height: 80px; margin-top: 15px;"></div>
            </div>

            <div class="card mini-chart">
                <h3>Engagement</h3>
                <div class="bar-group" id="engagementBars" style="display: flex; align-items: flex-end; gap: 5px; height: 80px; margin-top: 15px;"></div>
            </div>

            <div class="card mini-chart">
                <h3>Difficulty</h3>
                <div class="bar-group" id="difficultyBars" style="display: flex; align-items: flex-end; gap: 5px; height: 80px; margin-top: 15px;"></div>
            </div>
        </div>

    </main>

</div>

<script type="module">
    import { requireAuth } from "../../js/core/session.js";
    import { renderHistoricalTrends } from "../../js/features/historical-trends.js";

    const user = requireAuth();

    if (user) {
        document.getElementById("userName").innerText = user.name;
        document.getElementById("userDept").innerText = user.department;
        renderHistoricalTrends();
    }

    window.goBack = function(){
        window.location.href="reports.html";
    };
</script>

</body>
</html>
