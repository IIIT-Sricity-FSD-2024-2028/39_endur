<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Feedback History</title>

<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/utilities.css">

<link rel="stylesheet" href="../../css/components/button.css">
<link rel="stylesheet" href="../../css/components/sidebar.css">
<link rel="stylesheet" href="../../css/components/table.css">
<link rel="stylesheet" href="../../css/components/badge.css">

<link rel="stylesheet" href="../../css/pages/dashboard.css">

</head>


<body>


<div class="dashboard-layout">


<!-- SIDEBAR -->

<aside class="sidebar">


<div class="sidebar-logo">

<img src="../../assets/logos/endur-logo.svg">

<div>

<strong>Endur</strong>

<p>Student Portal</p>

</div>

</div>



<nav class="sidebar-menu">

<a href="dashboard.html">

Dashboard

</a>


<a href="courses.html">

My Courses

</a>


<a href="pending-feedback.html">

Pending Feedbacks

</a>


<a class="active">

History

</a>

</nav>



<a href="profile.html" class="sidebar-user">

<div id="avatar" class="avatar"></div>

<div>

<strong id="userName"></strong>

<p id="userDept"></p>

</div>

</a>


</aside>




<!-- MAIN -->

<main class="dashboard-content">


<h1>

Feedback History

</h1>



<table class="data-table">

<thead>

<tr>

<th>

Course

</th>


<th>

Date

</th>


<th>

Status

</th>

</tr>

</thead>



<tbody id="historyTable">

</tbody>

</table>



</main>


</div>



<script type="module">

import { requireAuth }
from "../../js/core/session.js";

import { get }
from "../../js/core/storage.js";


const user =
requireAuth();


/* sidebar */

document.getElementById("userName").innerText =
user.name;

document.getElementById("userDept").innerText =
user.department;

document.getElementById("avatar").innerText =
user.name
.split(" ")
.map(n=>n[0])
.join("");



/* history data */

const submissions =
get("submittedFeedback") || [];


const mySubmissions =
submissions.filter(
s => s.userId === user.id
);



const res =
await fetch("../../js/mock-data/courses.json");

const courses =
await res.json();



const table =
document.getElementById("historyTable");


table.innerHTML = "";


mySubmissions.forEach(s=>{

const course =
courses.find(
c => c.id === s.course
);


table.innerHTML +=

`
<tr>

<td>

<strong>

${course?.name || s.course}

</strong>

<br>

<span class="sub-text">

${s.course}

</span>

</td>


<td>

${new Date(s.date).toLocaleDateString()}

</td>


<td>

<span class="badge complete">

Completed

</span>

</td>

</tr>

`;

});


if(mySubmissions.length===0){

table.innerHTML =

`
<tr>

<td colspan="3">

No feedback submitted yet

</td>

</tr>

`;

}

</script>


</body>

</html>
