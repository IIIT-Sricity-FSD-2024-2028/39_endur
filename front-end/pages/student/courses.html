<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Courses</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/utilities.css">
    <link rel="stylesheet" href="../../css/components/card.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/course-card.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>

<body>
    <div class="dashboard-layout">

        <!-- sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../assets/logos/endur-logo.svg">
                <div>
                    <strong>Endur</strong>
                    <p>Student Portal</p>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a class="active">My Courses</a>
                <a href="pending-feedback.html">Pending Feedbacks</a>
                <a href="feedback-history.html">History</a>
            </nav>

            <a href="profile.html" class="sidebar-user">
                <div id="avatar" class="avatar"></div>
                <div>
                    <strong id="userName"></strong>
                    <p id="userDept"></p>
                </div>
            </a>
        </aside>

        <!-- main -->
        <main class="dashboard-content">
            <h1>My Courses</h1>
            <p class="subtitle">Courses assigned this semester</p>

            <div id="courseGrid" class="course-grid"></div>
        </main>
    </div>

    <script type="module">
        import { requireAuth } from "../../js/core/session.js";

        const user = requireAuth();

        if (user) {
            document.getElementById("userName").innerText = user.name;
            document.getElementById("userDept").innerText = user.department;

            /* avatar */
            document.getElementById("avatar").innerText = user.name
                .split(" ")
                .map(n => n[0])
                .join("");

            loadMyCourses();
        }

        async function loadMyCourses() {
            /* load courses */
            const res = await fetch("../../js/mock-data/courses.json");
            const allCourses = await res.json();
            const grid = document.getElementById("courseGrid");

            // Get user's enrolled courses array
            const myCourseIds = user.enrolledCourses || [];

            // Unified Data Fix: Fetch course details from global systemCourses for the thumbnail
            const systemCourses = JSON.parse(localStorage.getItem("systemCourses")) || [];
            
            // Filter by "standard" AND check if the student is actually enrolled
            const enrollmentList = systemCourses.length > 0 ? systemCourses : allCourses;

            enrollmentList
                .filter(c => myCourseIds.includes(c.id))
                .forEach(course => {
                    // Constant: Sync icons with dashboard.js
                    const thumb = course.id === "reviewOfReviews" ? 'img_bookclub.jpg' : (course.thumbnail || 'img_read.jpg');
                    
                    grid.innerHTML += `
                        <div class="course-card" style="padding:0; overflow:hidden; border:1px solid var(--glass-border); background:var(--surface);">
                            <div class="card-image" style="height:140px; width:100%; position:relative;">
                                <img src="../../assets/images/${thumb}" style="width:100%; height:100%; object-fit:cover;">
                                <span class="tag" style="position:absolute; top:12px; left:12px; margin:0;">${course.department || "COURSE"}</span>
                            </div>
                            <div style="padding:20px;">
                                <h3 style="margin-bottom:8px; font-size:1.1rem;">${course.id}: ${course.name}</h3>
                                <p style="color:var(--text-muted); font-size:0.9rem;">${course.faculty}</p>
                            </div>
                        </div>
                    `;
                });

            if (grid.innerHTML === "") {
                grid.innerHTML = "<p style='color:var(--text-muted); padding: 20px;'>No enrolled courses found for this semester.</p>";
            }
        }
    </script>
</body>

</html>
