<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dean Dashboard | Endur</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/utilities.css">
    <link rel="stylesheet" href="../../css/components/card.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/badge.css">
    <link rel="stylesheet" href="../../css/components/stats.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <style>
        /* Specific Styles for Dean's Progress Bars */
        .dept-row { margin-bottom: 20px; }
        .dept-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #334155; }
        .dept-bar-bg { background: #f1f5f9; border-radius: 4px; height: 10px; width: 100%; overflow: hidden; }
        .dept-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .alert-card { padding: 16px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border: 1px solid; }
        .alert-danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .alert-warning { background: #fffbeb; border-color: #fde68a; color: #b45309; }
        .alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
        .alert-card h4 { margin-bottom: 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="dashboard-layout">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../assets/logos/endur-logo.svg" alt="Endur">
            <div>
                <strong>Endur</strong>
                <p>Institutional Portal</p>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a class="active" href="dashboard.html">Dashboard</a>
            <a href="faculty-management.html">Faculty Management</a>
            <a href="cycle-management.html">Cycle Management</a>
            
        </nav>

        <a href="profile.html" class="sidebar-user">
            <div id="avatar" class="avatar"></div>
            <div>
                <strong id="userName"></strong>
                <p id="userDept">Academics</p>
            </div>
        </a>
    </aside>

    <!-- MAIN -->
    <main class="dashboard-content">
        
        <div class="form-header" style="margin-bottom: 30px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;" class="animate-in">
            <div>
                <h1>Dean Dashboard</h1>
                <p class="subtitle">Institutional performance and quality oversight.</p>
            </div>
            <div style="display: flex; gap: 16px; align-items: center;">
                <button id="exportTrendsBtn" class="btn-primary" style="display: none;">Export Trends (CSV)</button>
                <span class="badge primary animate-pop delay-1">DEAN VIEW</span>
            </div>
        </div>
        </div>

        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
            <div class="stat-card animate-in delay-1">
                <div style="color: #1e40af; border-radius: 50%; font-size: 20px;">📈</div>
                <div>
                    <p style="font-size: 11px; text-transform: uppercase; font-weight: bold; color: #94a3b8; margin-bottom: 4px;">Institutional Average</p>
                    <h2 id="instOverallScore" style="font-size: 28px; margin: 0;">0.0</h2>
                </div>
            </div>
            
            <div class="stat-card animate-in delay-2">
                <div style="color: #9d174d; border-radius: 50%; font-size: 20px;">🔄</div>
                <div>
                    <p style="font-size: 11px; text-transform: uppercase; font-weight: bold; color: #94a3b8; margin-bottom: 4px;">Active Cycles</p>
                    <h2 id="instActiveCycles" style="font-size: 28px; margin: 0;">0</h2>
                </div>
            </div>

            <div class="stat-card animate-in delay-3">
                <div style="color: #475569; border-radius: 50%; font-size: 20px;">👥</div>
                <div>
                    <p style="font-size: 11px; text-transform: uppercase; font-weight: bold; color: #94a3b8; margin-bottom: 4px;">Participation</p>
                    <h2 id="instParticipation" style="font-size: 28px; margin: 0;">0%</h2>
                </div>
            </div>
        </div>


        <!-- FULL WIDTH CHART -->
        <div style="display: block;" class="animate-in delay-4">
            
            <!-- DEPARTMENTS CHART -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h3 style="color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Departmental Performance</h3>
                    <span style="font-size: 12px; color: #64748b;">Current Year</span>
                </div>
                
                <div id="deptBarsContainer">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

    </main>
</div>

<script type="module">
    import { requireAuth } from "../../js/core/session.js";
    import { renderDeanDashboard } from "../../js/features/dean-dashboard.js";

    document.addEventListener("DOMContentLoaded", () => {
        const user = requireAuth();
        if(!user) return;

        document.getElementById("userName").innerText = user.name;
        const avatarEl = document.getElementById("avatar");
        if(avatarEl) avatarEl.innerText = user.name.split(" ").map(n => n[0]).join("");

        renderDeanDashboard();
    });
</script>

</body>
</html>
