<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback History</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/utilities.css">
    <link rel="stylesheet" href="../../css/components/button.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/table.css">
    <link rel="stylesheet" href="../../css/components/badge.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../../assets/logos/endur-logo.svg">
                <div>
                    <strong>Endur</strong>
                    <p>Student Portal</p>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="courses.html">My Courses</a>
                <a href="pending-feedback.html">Pending Feedbacks</a>
                <a class="active">History</a>
            </nav>

            <a href="profile.html" class="sidebar-user">
                <div id="avatar" class="avatar"></div>
                <div>
                    <strong id="userName"></strong>
                    <p id="userDept"></p>
                </div>
            </a>
        </aside>

        <main class="dashboard-content">
            <h1>Feedback History</h1>
            <p class="subtitle">A record of all your past course evaluations across semesters.</p>

            <table class="data-table" style="margin-top: 24px;">
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Cycle Name</th>
                        <th>Date Submitted</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                </tbody>
            </table>
        </main>
    </div>

    <script type="module">
        import { requireAuth } from "../../js/core/session.js";
        import { GET } from "../../js/core/api.js";

        const user = requireAuth();

        document.getElementById("userName").innerText = user.name;
        document.getElementById("userDept").innerText = user.department;
        document.getElementById("avatar").innerText = user.name.split(" ").map(n=>n[0]).join("");

        let mySubmissions = [];
        try {
            const allSubmissions = await GET(`/feedback-responses?studentId=${encodeURIComponent(user.id)}`);
            mySubmissions = allSubmissions.sort((a, b) => new Date(b.date) - new Date(a.date));
        } catch(e) {}

        let courses = window.allCourses || [];
        try {
            courses = await GET("/courses");
        } catch(e) {}

        const table = document.getElementById("historyTable");
        table.innerHTML = "";

        mySubmissions.forEach(s => {
            const course = courses.find(c => c.id === s.courseId);
            const cycleText = s.cycleId ? s.cycleId : "Archived Cycle";
            const dateStr = s.submittedAt ? new Date(s.submittedAt).toLocaleDateString() : "Unknown";

            let detailsHtml = '';
            if (s.ratings) {
                const isArray = Array.isArray(s.ratings);
                let html = '<div style="margin-top:12px; padding:12px; background:rgba(241,245,249,0.5); border-radius:8px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">';
                if (isArray) {
                    s.ratings.forEach(r => {
                        html += `<div><span style="font-size:11px; color:#64748b;">${r.name}:</span> <strong>${r.score}%</strong></div>`;
                    });
                } else {
                    Object.entries(s.ratings).forEach(([k,v]) => {
                        html += `<div><span style="font-size:11px; color:#64748b;">${k}:</span> <strong>${v}%</strong></div>`;
                    });
                }
                html += '</div>';
                
                if (s.comments) {
                    html += `<div style="margin-top:8px; padding:12px; font-size:12px; background:#fff; border:1px solid #e2e8f0; border-radius:8px; font-style:italic;">"${s.comments}"</div>`;
                }
                detailsHtml = html;
            }

            table.innerHTML += `
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding-top:16px; padding-bottom:16px;">
                        <strong>${course?.name || s.courseId}</strong><br>
                        <span class="sub-text">${s.courseId}</span>
                        ${detailsHtml}
                    </td>
                    <td style="vertical-align:top; padding-top:16px;">
                        <span class="badge neutral" style="font-size: 11px; text-transform: uppercase;">${cycleText}</span>
                    </td>
                    <td style="vertical-align:top; padding-top:16px;">${dateStr}</td>
                    <td style="vertical-align:top; padding-top:16px;">
                        <span class="badge complete">Completed</span>
                    </td>
                </tr>
            `;
        });

        if(mySubmissions.length === 0){
            table.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center; padding: 30px; color: #64748b;">
                        No feedback submitted yet.
                    </td>
                </tr>
            `;
        }
    </script>
</body>
</html>
